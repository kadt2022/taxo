name: Taxo Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxo-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Taxo Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify toolchain
        run: |
          python --version
          node --version
          npm --version
          docker compose version
      - name: Verify required files
        run: |
          test -f backend/requirements.txt
          test -f frontend/package-lock.json
          test -f docker-compose.yml
          test -f .github/scripts/check_database.py
          test -f .github/scripts/check_containers.py
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
