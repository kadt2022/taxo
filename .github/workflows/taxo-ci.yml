name: Taxo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Taxo Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app
      - name: Run all backend tests
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: taxo-backend-tests
          path: backend/reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Taxo Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Type-check and build frontend
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v6
        with:
          name: taxo-frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  database:
    name: Taxo PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taxo
          POSTGRES_PASSWORD: taxo
          POSTGRES_DB: taxo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxo -d taxo_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://taxo:taxo@localhost:5432/taxo_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify migration round trip and model alignment
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
      - name: Verify API persistence on migrated PostgreSQL
        env:
          PYTHONPATH: .
        run: python ../.github/scripts/check_database.py

  containers:
    name: Taxo Docker Smoke
    needs: [backend, frontend, database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: taxo-ci
      TAXO_REPOSITORIES: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and start the complete application
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Verify portal, proxy, API and repository scan
        run: python .github/scripts/check_containers.py
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color > taxo-compose.log 2>&1
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: taxo-compose-logs
          path: taxo-compose.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop containers and remove CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  status:
    name: Taxo CI Status
    needs: [backend, frontend, database, containers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'length > 0 and all(.[]; .result == "success")'
